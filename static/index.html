<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Hypervisor Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div id="login-screen" class="screen">
        <div class="login-card">
            <h1>Hybrid Hypervisor Platform</h1>
            <p class="subtitle">Connexion requise</p>
            <form id="login-form">
                <input type="text" id="username" placeholder="Nom d'utilisateur" required>
                <input type="password" id="password" placeholder="Mot de passe" required>
                <button type="submit">Se connecter</button>
                <p id="login-error" class="error-message"></p>
            </form>
        </div>
    </div>

    <div id="dashboard-screen" class="screen hidden">
        <header>
            <h1>Hybrid Hypervisor Platform</h1>
            <button id="logout-button">Déconnexion</button>
        </header>

        <div id="admin-bar">
            <button id="refresh-button">Actualiser tout</button>
            <button id="activity-log-button">Journal d'activité</button>
            <span id="last-check-label"></span>
        </div>

        <main>
            <section id="stats-section">
                <div class="stats-grid">
                    <div class="stat-box">
                        <p class="stat-value" id="stat-total-vms">-</p>
                        <p class="stat-label">VMs totales</p>
                    </div>
                    <div class="stat-box">
                        <p class="stat-value" id="stat-running-vms">-</p>
                        <p class="stat-label">Actives</p>
                    </div>
                    <div class="stat-box">
                        <p class="stat-value" id="stat-hypervisors-online">-</p>
                        <p class="stat-label">Hyperviseurs en ligne</p>
                    </div>
                </div>
            </section>

            <section id="hypervisors-section">
                <h2>Hyperviseurs</h2>
                <div id="hypervisors-grid" class="cards-grid">
                </div>
            </section>

            <section id="uptime-section">
                <h2>Disponibilité (historique)</h2>
                <div id="uptime-chart"></div>
            </section>

            <section id="vms-section">
                <h2>Machines virtuelles</h2>
                <div id="vms-list">
                </div>
            </section>
        </main>
    </div>

    <div id="activity-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Journal d'activité</h2>
            <button id="close-activity-modal">&times;</button>
        </div>
        <div id="activity-list"></div>
    </div>
</div>

    <script src="/static/app.js"></script>
</body>
</html>
